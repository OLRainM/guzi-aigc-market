openapi: 3.0.3
info:
  title: AIGC 3D Platform API
  version: 0.4.0
  description: 生成任务、商品草稿与资产上传接口。创建商品可带 generation_job_id 复制已完成任务的 GLB。
  license:
    name: Proprietary
    url: https://example.com/proprietary-license
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /products:
    post:
      operationId: createProduct
      summary: 创建商品草稿，可选绑定已完成生成任务的 GLB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, price_cents, ip_name, category, condition, stock]
              properties:
                title: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string }
                price_cents: { type: integer, minimum: 1 }
                ip_name: { type: string }
                category: { type: string }
                condition: { type: string }
                stock: { type: integer, minimum: 0 }
                transaction_type: { type: string, enum: [SALE, PREORDER, EXCHANGE] }
                generation_job_id: { type: string, format: uuid, description: 成功任务的 ID；会复制 GLB 到商品资产，仍需补图后才能发布 }
      responses:
        '201':
          description: 草稿已创建；若带 generation_job_id 则已绑定复制后的模型
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 生成任务不存在或不属于当前用户
        '409':
          description: 生成任务尚未完成
  /products/mine:
    get:
      operationId: listMyProducts
      summary: 查询当前用户发布的商品
      responses:
        '200':
          description: 当前用户的商品列表
        '401': { $ref: '#/components/responses/Unauthorized' }
  /products/{product_id}/publish:
    post:
      operationId: publishProduct
      summary: 发布草稿或重新上架已下架商品
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 商品状态已变为 PUBLISHED
        '400':
          description: 草稿缺少发布所需图片
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 商品不存在
        '409':
          description: 商品当前状态不允许发布
  /products/{product_id}/off-shelf:
    post:
      operationId: offShelfProduct
      summary: 下架已发布商品
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 商品状态已变为 OFF_SHELF
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 商品不存在
        '409':
          description: 商品当前状态不允许下架
  /products/{product_id}/images:
    post:
      operationId: uploadProductImage
      summary: 上传商品图片
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 图片已保存并绑定到商品
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 超出图片数量限制
  /products/{product_id}/model:
    post:
      operationId: uploadProductModel
      summary: 上传或替换商品 GLB
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: GLB 已保存并绑定到商品
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /products/{product_id}/assets/{asset_id}/content:
    get:
      operationId: getProductAssetContent
      summary: 读取商品图片或 GLB 内容
      security: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: asset_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 文件内容
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            model/gltf-binary: { schema: { type: string, format: binary } }
        '404':
          description: 商品未发布、商品不存在或资产不存在
  /generation-jobs/prompt-preview:
    post:
      operationId: previewGenerationPrompt
      summary: 预览优化后的生成 Prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptPreviewRequest'
      responses:
        '201':
          description: Prompt 优化预览已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptPreviewResponse'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Prompt 优化服务暂不可用
          content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
  /generation-jobs:
    post:
      operationId: createGenerationJob
      summary: 使用已确认 Prompt 创建生成任务
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenerationJobRequest'
      responses:
        '202':
          description: 任务已持久化并等待处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGenerationJobResponse'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/QueueUnavailable' }
    get:
      operationId: listGenerationJobs
      summary: 查询当前用户的生成任务
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobStatus' }
      responses:
        '200':
          description: 任务列表，按创建时间倒序
          content:
            application/json:
              schema:
                type: object
                required: [jobs, pagination]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/GenerationJob' }
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /generation-jobs/{job_id}:
    get:
      operationId: getGenerationJob
      summary: 查询当前用户的单个生成任务
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/GenerationJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/JobNotFound' }
  /generation-jobs/{job_id}/cancel:
    post:
      operationId: cancelGenerationJob
      summary: 取消任务（预留，阶段 1 后实现）
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 取消请求已接受
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/GenerationJob' }
        '404': { $ref: '#/components/responses/JobNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /generation-jobs/{job_id}/retry:
    post:
      operationId: retryGenerationJob
      summary: 重试失败任务
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: 任务已重新排队
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/GenerationJob' }
        '404': { $ref: '#/components/responses/JobNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users:
    get:
      operationId: adminListUsers
      summary: 管理员分页查看用户
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200': { description: 用户分页列表, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/products:
    get:
      operationId: adminListProducts
      summary: 管理员分页查看商品
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, PUBLISHED, OFF_SHELF] }
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200': { description: 商品分页列表, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProductList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/products/{product_id}/off-shelf:
    post:
      operationId: adminOffShelfProduct
      summary: 管理员下架已发布商品
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 商品已下架 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 商品不存在 }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/generation-jobs:
    get:
      operationId: adminListFailedGenerationJobs
      summary: 管理员查看失败生成任务
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 失败任务分页列表, content: { application/json: { schema: { $ref: '#/components/schemas/AdminJobList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/generation-jobs/{job_id}/retry:
    post:
      operationId: adminRetryGenerationJob
      summary: 管理员重试失败生成任务
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202': { description: 任务已重新排队, content: { application/json: { schema: { type: object, required: [job], properties: { job: { $ref: '#/components/schemas/GenerationJob' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/JobNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/audit-logs:
    get:
      operationId: adminListAuditLogs
      summary: 管理员查看审计日志
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 审计日志分页列表, content: { application/json: { schema: { $ref: '#/components/schemas/AuditLogList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
  schemas:
    JobStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELED]
    JobStage:
      type: string
      enum: [QUEUED, OPTIMIZING_PROMPT, SUBMITTING_PROVIDER, GENERATING, FETCHING_OUTPUT, STORING_OUTPUT, COMPLETED]
    PromptPreviewRequest:
      type: object
      additionalProperties: false
      required: [prompt, product_type]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 2000 }
        product_type: { type: string, minLength: 1, maxLength: 64 }
    PromptPreviewResponse:
      type: object
      required: [id, raw_prompt, product_type, optimized_prompt, source, expires_at]
      properties:
        id: { type: string, format: uuid }
        raw_prompt: { type: string }
        product_type: { type: string }
        optimized_prompt: { type: string }
        structured_prompt: { type: object, additionalProperties: true }
        rag_context: { type: object, additionalProperties: true }
        rag_version: { type: string }
        template_version: { type: string }
        source: { type: string }
        expires_at: { type: string, format: date-time }
    CreateGenerationJobRequest:
      type: object
      additionalProperties: false
      required: [prompt_preview_id, final_prompt, provider, copyright_confirmed]
      properties:
        prompt_preview_id: { type: string, format: uuid }
        final_prompt: { type: string, minLength: 1, maxLength: 1024 }
        provider: { type: string, enum: [mock, hy3d] }
        parameters: { type: object, additionalProperties: true }
        copyright_confirmed: { type: boolean, enum: [true] }
    CreateGenerationJobResponse:
      type: object
      required: [job, status_url]
      properties:
        job: { $ref: '#/components/schemas/GenerationJob' }
        status_url: { type: string, example: /api/v1/generation-jobs/0e225a1c-4838-46ae-a61b-03fcfc440b50 }
    GenerationJob:
      type: object
      required: [id, status, stage, progress, raw_prompt, provider, attempt, max_attempts, outputs, error, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        source_job_id: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/JobStatus' }
        stage: { $ref: '#/components/schemas/JobStage' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        raw_prompt: { type: string }
        optimized_prompt: { type: string, nullable: true }
        provider: { type: string }
        attempt: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1 }
        outputs:
          type: array
          items: { $ref: '#/components/schemas/GenerationOutput' }
        error:
          type: object
          allOf: [{ $ref: '#/components/schemas/JobError' }]
          nullable: true
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
    GenerationOutput:
      type: object
      required: [id, output_type, format, mime_type, size_bytes, sha256, created_at]
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid, nullable: true }
        output_type: { type: string, enum: [MODEL, PREVIEW_IMAGE] }
        format: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    JobError:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
    Pagination:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    AdminUser:
      type: object
      required: [id, username, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email, nullable: true }
        status: { type: string }
        roles: { type: array, items: { type: object, additionalProperties: true } }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminProduct:
      type: object
      required: [id, seller_id, title, description, price_cents, ip_name, category, condition, stock, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        price_cents: { type: integer, format: int64 }
        ip_name: { type: string }
        category: { type: string }
        condition: { type: string }
        transaction_type: { type: string }
        shipping_origin: { type: string }
        stock: { type: integer, minimum: 0 }
        preorder_note: { type: string }
        cover_asset_id: { type: string, format: uuid, nullable: true }
        model_asset_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED, OFF_SHELF] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminUserList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
    AdminProductList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminProduct' } }
    AdminJobList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/GenerationJob' } }
    AuditLog:
      type: object
      required: [id, actor_id, action, target_type, target_id, request_id, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        request_id: { type: string }
        before: { type: object, nullable: true, additionalProperties: true }
        after: { type: object, nullable: true, additionalProperties: true }
        created_at: { type: string, format: date-time }
    AuditLogList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
    APIError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
  responses:
    InvalidArgument:
      description: 参数不合法
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    Unauthorized:
      description: 未认证
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    Forbidden:
      description: 无权执行管理员操作
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    JobNotFound:
      description: 任务不存在或当前用户无权访问
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    Conflict:
      description: Idempotency-Key 请求内容冲突或任务状态不允许操作
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    TooManyRequests:
      description: 请求过于频繁
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    QueueUnavailable:
      description: 任务队列暂不可用
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
